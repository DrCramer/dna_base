services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-dna_registry}
      POSTGRES_USER: ${POSTGRES_USER:-dna}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-dna}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dna -d dna_registry"]
      interval: 5s
      timeout: 5s
      retries: 20

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-dna}:${POSTGRES_PASSWORD:-dna}@postgres:5432/${POSTGRES_DB:-dna_registry}
      SECRET_KEY: ${SECRET_KEY:-change-this-secret-before-production}
      STORAGE_DIR: ${STORAGE_DIR:-/app/data}
      PRINT_DATA_DIR: ${PRINT_DATA_DIR:-/app/data/print}
      PRINT_JOB_TTL_HOURS: ${PRINT_JOB_TTL_HOURS:-2}
      PRINT_MAX_UPLOAD_MB: ${PRINT_MAX_UPLOAD_MB:-500}
      PRINT_MAX_FILES: ${PRINT_MAX_FILES:-2000}
      PRINT_MAX_SINGLE_FILE_MB: ${PRINT_MAX_SINGLE_FILE_MB:-50}
      PRINT_MAX_UNPACKED_MB: ${PRINT_MAX_UNPACKED_MB:-1500}
      PRINT_MAX_ZIP_DEPTH: ${PRINT_MAX_ZIP_DEPTH:-8}
      PRINT_CONVERT_WORKERS: ${PRINT_CONVERT_WORKERS:-4}
      PRINT_CONVERSION_TIMEOUT_SECONDS: ${PRINT_CONVERSION_TIMEOUT_SECONDS:-120}
      PRINT_REQUIRE_SAME_PAGE_SIZE: ${PRINT_REQUIRE_SAME_PAGE_SIZE:-}
      PRINT_ALLOW_DROP_BLANK_EXTRA_PAGES: ${PRINT_ALLOW_DROP_BLANK_EXTRA_PAGES:-true}
      CORS_ORIGINS: ${CORS_ORIGINS:-["http://localhost:4001","http://127.0.0.1:4001","http://localhost:4000","http://127.0.0.1:4000"]}
      CORS_ORIGIN_REGEX: ${CORS_ORIGIN_REGEX:-^https?://(localhost|127\.0\.0\.1|10\.\d+\.\d+\.\d+|172\.(1[6-9]|2\d|3[0-1])\.\d+\.\d+|192\.168\.\d+\.\d+)(:\d+)?$}
    volumes:
      - storage:/app/data
    tmpfs:
      - /tmp:size=1g,mode=1777
    depends_on:
      postgres:
        condition: service_healthy
    command: sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000"

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    restart: unless-stopped
    ports:
      - "${APP_PORT:-4001}:80"
    depends_on:
      - backend

volumes:
  postgres_data:
  storage:
