upstream dna_backend {
    server backend:8000;
    keepalive 32;
}

server {
    listen 80;
    server_name _;
    client_max_body_size 600m;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_vary on;
    gzip_proxied any;
    gzip_types
        application/javascript
        application/json
        application/octet-stream
        application/xml
        image/svg+xml
        text/css
        text/plain
        text/xml;

    location = /index.html {
        add_header Cache-Control "no-store";
        try_files /index.html =404;
    }

    location = /favicon.svg {
        add_header Cache-Control "public, max-age=604800";
        try_files /favicon.svg =404;
    }

    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    location /api/ {
        proxy_pass http://dna_backend/api/;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /print/static/ {
        proxy_pass http://dna_backend/print/static/;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /print {
        proxy_pass http://dna_backend/print;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /health {
        proxy_pass http://dna_backend/health;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
    }

    location / {
        add_header Cache-Control "no-store";
        try_files $uri /index.html;
    }
}
